databases:
  - name: paydraft-db
    plan: free
    databaseName: paydraft
    user: paydraft

services:
  - type: web
    name: paydraft
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paydraft-db
          property: connectionString
